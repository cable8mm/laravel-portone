providers:
  - Cable8mm\LaravelPortone\PortOneServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  - AUTH_MODEL='Workbench\App\Models\User'
  # The sample shop checks pending payments after 1 minute instead of the default 24 hours.
  - PORTONE_PENDING_EXPIRE_AFTER=1

workbench:
  install: true
  start: /shop
  discovers:
    web: true
    views: true
  build:
    - create-sqlite-db
    - migrate-fresh:
        --force: true
    - db-seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
        --force: true
