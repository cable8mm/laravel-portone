name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Forks have no Claude secret or app installation, so run only in this repository.
    if: |
      github.repository == 'cable8mm/laravel-portone' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Open the pull request instead of only posting a link to a pre-filled one.
          claude_args: |
            --allowed-tools "Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "When you push a new branch for an issue, open the pull request yourself with gh pr create against main instead of only posting a link. Use a Conventional Commits 1.0.0 title, describe the change and how it was tested in the body, and add 'Closes #<issue number>'. Request a review from the maintainer with --reviewer cable8mm. Commit messages must also follow Conventional Commits 1.0.0. Live tests (composer live) need a human operating the PortOne payment window and local secrets, so they cannot run here: when AGENTS.md requires live verification for the change, do not claim it is verified; list in the pull request the live tests the maintainer must run locally and ask them to run them."

